name            = "lottery-data-updater"
main            = "worker.js"
compatibility_date = "2026-10-06"

# ---------------------------------------------------------------------------
# Cron Triggers (3 max on Cloudflare free plan)
#
# UTC times — draws happen at ~20:00 BRT (UTC-3), ~21:00 BRT (BRST UTC-2)
#
# OFFSET BY +15 MIN FROM THE GITHUB ACTIONS SCHEDULE ON PURPOSE.
# .github/workflows/data-update.yml keeps its original crons
# (45 1 * * 2-6, 0 10 * * 2-6, 0 23 * * 0, among others) as a safety net
# during this Worker's validation period. Running both systems at the
# exact same minute means both would read-then-commit to the same files
# on `main` at roughly the same time, racing on the GitHub ref update —
# and a ref-conflict there IS handled gracefully now (opens a GitHub
# Issue instead of failing silently), but there's no reason to manufacture
# that race on every single run. The 15-minute offset avoids it outright.
# This offset can stay in place indefinitely — once the GitHub Actions
# crons are removed (a later, separate decision), there's nothing left
# to collide with, so there's no need to "undo" it.
#
#   0 2 * * 2-6    = 23:00 BRT (Mon-Fri)  → intermediate follow-up ~3h post-draw
#   15 10 * * 2-6  = 07:15 BRT (Tue-Sat)  → final fallback, next morning
#   15 23 * * 0    = 20:15 BRT (Sunday)   → final fallback for Sunday morning draws
#
# "Final fallback" crons (15 10 * * 2-6 and 15 23 * * 0) set
# ALLOW_CHECKED_ONLY_STATUS_WRITE=true so a successful check with no new
# contest still persists lastCheckedAt, keeping status.json fresh.
# The intermediate cron (0 2 * * 2-6) skips the status commit when
# nothing changed, to avoid noisy status-only commits in Git history.
# ---------------------------------------------------------------------------

[triggers]
crons = [
  "0 2 * * 2-6",   # 23:00 BRT Mon-Fri — intermediate follow-up (+15min vs GH Actions' 22:45)
  "15 10 * * 2-6", # 07:15 BRT Tue-Sat — final fallback (+15min vs GH Actions' 07:00)
  "15 23 * * 0",   # 20:15 BRT Sunday  — final fallback for Sunday draws (+15min vs GH Actions' 20:00)
]
