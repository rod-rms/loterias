name: CI

# Deliberately does not call the live CAIXA data source (no `npm run
# data:update` here). PR/main quality gates must stay deterministic and
# must never turn red because an external service is temporarily
# unavailable or slow. Live CAIXA integration is owned exclusively by the
# scheduled `data-update.yml` workflow, which has its own resilience
# (retries/backoff) and its own failure-alerting (GitHub Issues) — see
# docs/global/ARCHITECTURE_V1.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:unit

      - name: Mega-Sena oracle regression (24 tests)
        run: npm run test:mega:oracle

      - name: Lotofacil RMS v2 oracle (contest 3780)
        run: npm run test:lotofacil:oracle

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Critical E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
