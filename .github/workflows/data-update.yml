name: Update lottery datasets

# Post-draw verification schedule.
#
# What is known: draws happen on Sunday and Monday as well as Tue-Sat, and CAIXA's official monthly
# calendar is authoritative and may move a draw (holidays/exceptions; use workflow_dispatch then).
# What is NOT known: when CAIXA publishes a given draw's result, in particular on Sundays. The history
# in this repository (ROADMAP.md, DATA-002) shows Sunday results were never captured during Sunday
# daytime and were usually captured only on Tuesday morning, so this schedule deliberately makes NO
# assumption about the Sunday publication time: it covers Sunday itself, Sunday night, and Monday
# daytime, and the updater now logs when each contest is first seen so the real lag can be measured
# (see the "latest endpoint" and "first seen" lines in the "Update datasets" step output).
#
# GitHub also delivers scheduled runs late (typically 2-4 hours in this repository), so each nominal
# time below is a lower bound, not a promise. Every window is idempotent: the updater only fetches
# missing contests and is a no-op otherwise.
#
# BRT = UTC-3 (no DST since 2019), so a BRT time past 21:00 lands after midnight UTC on the NEXT UTC
# calendar day. That is why the "evening follow-up" crons run on UTC days Mon-Sat (1-6): they follow
# evening draws on Sun-Fri BRT (a Sunday-night result is looked for on UTC Monday).
#
# Coverage (UTC):
#   Evening follow-ups, UTC days Mon-Sat:
#     01:45 and 03:30 (intermediate), 10:00 (final fallback)
#   Monday-only extra follow-ups (a Sunday result may only appear during Monday daytime):
#     15:00 (12:00 BRT) and 19:00 (16:00 BRT), both intermediate
#   Sunday follow-ups (kept):
#     16:00 and 18:30 (intermediate), 23:00 (final fallback)
#
# "Intermediate" windows log a successful check but do not create a status-only commit when no new
# contest was found (to avoid noisy Git history); the "final fallback" windows DO persist
# lastCheckedAt even with no new contest, so the app can truthfully show the last time the official
# source was verified. Any window that finds a new contest always commits.
#
# Overdue draws: the updater reads the next-draw date from CAIXA's latest payload. If it is past a
# margin (next day 14:00 BRT, see OVERDUE_MARGIN_NEXT_DAY_BRT_HOUR in scripts/data/overdue.mjs) and the
# latest contest has not advanced, the "Alert on overdue draw" step opens/updates the
# data-update-failure issue (at most once per 12 h) instead of a silent no-op.
on:
  schedule:
    - cron: "45 1 * * 1-6" # 22:45 BRT Sun-Fri -> 01:45 UTC Mon-Sat — evening follow-up 1 (intermediate)
    - cron: "30 3 * * 1-6" # 00:30 BRT Mon-Sat -> 03:30 UTC Mon-Sat — evening follow-up 2 (intermediate)
    - cron: "0 10 * * 1-6" # 07:00 BRT Mon-Sat -> 10:00 UTC Mon-Sat — evening follow-up 3 (final fallback)
    - cron: "0 15 * * 1" # 12:00 BRT Monday -> 15:00 UTC Monday — extra follow-up for a Sunday result (intermediate)
    - cron: "0 19 * * 1" # 16:00 BRT Monday -> 19:00 UTC Monday — extra follow-up for a Sunday result (intermediate)
    - cron: "0 16 * * 0" # 13:00 BRT Sunday -> 16:00 UTC Sunday — Sunday follow-up 1 (intermediate)
    - cron: "30 18 * * 0" # 15:30 BRT Sunday -> 18:30 UTC Sunday — Sunday follow-up 2 (intermediate)
    - cron: "0 23 * * 0" # 20:00 BRT Sunday -> 23:00 UTC Sunday — Sunday follow-up 3 (final fallback)
  workflow_dispatch: {}

permissions:
  contents: write
  # Used only by the failure-alert/recovery steps below (GitHub Issues),
  # never to reach any third-party or paid alerting service.
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update datasets from the official CAIXA source
        id: update
        # Manual runs (workflow_dispatch) and the two "final fallback"
        # crons ("0 10 * * 1-6" and "0 23 * * 0") are allowed to persist a
        # checked-only status update (no new contest, but the source was
        # successfully verified). All other scheduled runs only persist a
        # status change when a new contest was actually imported, to avoid
        # noisy status-only commits.
        # OVERDUE_REPORT_PATH: where the updater writes the overdue-draw report (and sets the
        # `overdue` step output) for the "Alert on overdue draw" step below.
        env:
          ALLOW_CHECKED_ONLY_STATUS_WRITE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 1-6' || github.event.schedule == '0 23 * * 0' }}
          OVERDUE_REPORT_PATH: ${{ runner.temp }}/overdue-report.json
        run: npm run data:update

      - name: Validate datasets
        run: npm run data:validate

      - name: Detect changes
        id: git-diff
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated datasets
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "loterias-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/lotofacil/results.json public/data/megasena/results.json public/data/status.json
          git commit -m "data: update lottery datasets"
          git push

      # --- Operational alerting (GitHub-native, no new secret, no paid service) ---
      #
      # The updater itself is already resilient (timeouts, retries, backoff,
      # 429 handling, payload validation, atomic writes, gap detection, and
      # preservation of the last known-good dataset on failure). What it
      # cannot do on its own is tell anyone when the CAIXA source has
      # changed format or become persistently unavailable — production
      # keeps serving the previous valid dataset silently. The alert and recovery steps (plus the overdue-draw alert)
      # close that gap using GitHub Issues as the alert channel.
      #
      # Duplicate prevention: all of them key off the same open issue with
      # the `data-update-failure` label — a marker this workflow owns.
      # Manually created issues are never touched, since they won't carry
      # that label unless someone deliberately adds it.

      - name: Alert on updater failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "data-update-failure";
            const title = "[Data] Falha na atualização das loterias";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const schedule = context.payload && context.payload.schedule ? context.payload.schedule : null;
            const body = [
              `A execução do workflow **${context.workflow}** falhou.`,
              "",
              `- Execução: ${runUrl}`,
              `- Evento: \`${context.eventName}\`${schedule ? ` (agenda \`${schedule}\`)` : ""}`,
              `- Commit/ref: \`${context.sha}\` em \`${context.ref}\``,
              `- Horário (UTC): ${new Date().toISOString()}`,
              "",
              "O último dataset validado foi preservado — a aplicação continua servindo os dados anteriores normalmente.",
              "",
              "Enquanto esta falha não for corrigida, novos concursos podem deixar de chegar automaticamente à base local. Esta issue fecha sozinha quando uma execução seguinte tiver sucesso.",
            ].join("\n");

            // The label is our sole deduplication/recovery key, but this
            // workflow must not assume a repository administrator has
            // already created it (e.g. right after the repo is created).
            // Idempotently ensure it exists first: check, then create, and
            // treat "already exists" (a concurrent run winning the race) as
            // success rather than an error.
            async function ensureLabelExists() {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
              } catch (getError) {
                if (getError.status !== 404) throw getError;
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: "d73a4a",
                    description: "Falha automática na atualização dos dados das loterias (criada/gerenciada por data-update.yml)",
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError; // 422 = another run already created it concurrently.
                }
              }
            }
            await ensureLabelExists();

            const { data: openIncidents } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (openIncidents.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIncidents[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      # An overdue draw is NOT a job failure (the dataset is intact), so the run stays green; this step
      # raises the alert on the shared `data-update-failure` issue, at most once per 12 h. The text lives in
      # scripts/data/overdue-alert.cjs (unit-tested). It is deliberately separate from the failure alert above.
      - name: Alert on overdue draw
        if: always() && steps.update.outputs.overdue == 'true'
        uses: actions/github-script@v7
        env:
          OVERDUE_REPORT_PATH: ${{ runner.temp }}/overdue-report.json
        with:
          script: |
            const fs = require("fs");
            const overdueAlert = require(`${process.env.GITHUB_WORKSPACE}/scripts/data/overdue-alert.cjs`);
            const entries = JSON.parse(fs.readFileSync(process.env.OVERDUE_REPORT_PATH, "utf8"));
            const result = await overdueAlert({ github, context, entries });
            core.info(`overdue alert: ${result.action}`);

      # Skipped on a run that is itself overdue: the issue must stay open until the data actually catches up.
      - name: Close updater incident on recovery
        if: success() && steps.update.outputs.overdue != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "data-update-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: openIncidents } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            for (const issue of openIncidents) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recuperado: a atualização das loterias voltou a funcionar normalmente.\n\n- Execução: ${runUrl}\n- Horário (UTC): ${new Date().toISOString()}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
